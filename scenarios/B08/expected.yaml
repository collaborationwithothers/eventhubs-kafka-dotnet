schema_version: 1
id: B08
assessment_rules:
  observation_unit: fresh_client_single_action
  repeats_per_configuration: 5
  replacement_repeats: 0
  completion_checks:
  - V1
  - V2
  - V3
  - V4
  - V5
  - V6
  - V7
  - V8
  - V9
  - V10
  - V11
  - V12
  outcome_class:
  - result
  - error_code
  - is_fatal
  - origin
  require_one_class_in_all_five: true
  unequal_classes: separate_full_plan_no_verdict
  incomplete_configuration: no_verdict
  construction_origin: untestable
  failed_control: untestable
  adr012_counts: not_applicable
  evidence_policy: docs/agents/factory.md#evidence-pack
  error_text_compared: false
  changed_expectations_require_human_approval: true
  semantic_comparison_fields:
  - delivered_partition
  - consumed_partition
  - key_base64
  - value_match
hypotheses:
  H_partition:
    question: Does automatic partition selection match the pinned client algorithms on Event Hubs?
    configurations:
    - C0
    - C1
    decision: in batch, a successful action with a present correlated read record but value_match=false adds v2_location
      to that repeat without marking it invalid. Repeat/configuration status is incomplete, Deterministic=null and
      OutcomeClass=null. On the final configuration assessment is {verdict:null,hypotheses:{H_partition:undecided},reason:incomplete_configuration};
      a nonfinal assessment stays null. This precedes expected or contrary partition inference. Otherwise both complete
      successful configurations, all five delivered/read partitions 30/2 respectively, exact key/value/location
      -> H_partition=holds, confirmed. If both configurations are successful but any has a complete deterministic
      delivery/read on a contrary partition -> H_partition=contradicted, contradicted. A complete deterministic
      error in either configuration takes precedence over partition comparison -> H_partition=undecided, untestable,
      reason `action_error`. Missing successful-send readback is incomplete, not contradiction. Partition metadata
      other than exactly 0..31 remains invalid input, not a partition finding.
verdict:
  decision: in batch, a successful action with a present correlated read record but value_match=false adds v2_location
    to that repeat without marking it invalid. Repeat/configuration status is incomplete, Deterministic=null and
    OutcomeClass=null. On the final configuration assessment is {verdict:null,hypotheses:{H_partition:undecided},reason:incomplete_configuration};
    a nonfinal assessment stays null. This precedes expected or contrary partition inference. Otherwise both complete
    successful configurations, all five delivered/read partitions 30/2 respectively, exact key/value/location ->
    H_partition=holds, confirmed. If both configurations are successful but any has a complete deterministic delivery/read
    on a contrary partition -> H_partition=contradicted, contradicted. A complete deterministic error in either
    configuration takes precedence over partition comparison -> H_partition=undecided, untestable, reason `action_error`.
    Missing successful-send readback is incomplete, not contradiction. Partition metadata other than exactly 0..31
    remains invalid input, not a partition finding.
  precedence: security finding -> null verdict, security_finding_requires_hari; missing required configuration ->
    null, missing_configuration; any invalid/incomplete configuration or missing final receipt -> null, incomplete_configuration;
    any complete unequal classes -> null, unequal_classes_separate_full_plan; complete deterministic construction-origin
    outcome -> untestable, construction_origin; then the item rules.
  no_verdict_when: Incomplete evidence, missing successful final receipt, missing configurations, unequal classes
    or security finding; no pooling or replacement repeats.
