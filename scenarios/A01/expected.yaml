schema_version: 1
id: A01

assessment_rules:
  live_and_component_evidence: evaluate_separately
  authoritative_verifier_counts: complete_valid_runs_only
  invalid_or_incomplete_run_counts: absent
  missing_counts_are_zero: false
  missing_counts_refute_hypotheses: false
  diagnostic_evidence: retain
  changed_expectations_require_human_approval: true

probe:
  required_usable_repeats: 5
  pass:
    measurement: stats.broker.throttle.max
    role: LoadGenProducer
    greater_than_ms: 20000
    aggregation: any_observation_across_all_five_usable_repeats
  complete_evidence_without_pass: untestable_at_build_scale
  missing_or_unusable_evidence: inconclusive
  oracle_invalidity_alone_invalidates_throttle_evidence: false
  passing_probe_proves_later_hypothesis_prerequisites: false

configurations:
  C0:
    H4:
      environments: [live]
      mode: recorded_only
      observation_unit: attributable_request
      categories:
        - client_timeout_before_response
        - broker_timeout_response_before_client_timeout
        - completed_without_observed_timeout
        - indeterminate
      broker_timeout_cause_attribution_required: true
      multiple_categories_per_repeat: allowed
      exhaustive_counts_require_complete_request_evidence: true
      pass_fail_expectation: none

  C2:
    H1:
      environments: [live]
      prediction: no_timeout_attributed_policy_violation
      qualifying_evidence:
        wire_request_timeout_ms: 5000
        matched_request_and_response: required
        response_throttle_ms:
          greater_than: 5000
          less_than: 20000
      qualifying_prediction_observed: consistent_with_floor
      exact_20000_ms_floor_established: false
      counterexample_requires_timeout_cause_attribution: true
      fully_attributed_counterexample: contradicted
      no_qualifying_request: inconclusive
      missing_or_ambiguous_evidence: inconclusive

  C3:
    H2:
      environments: [live, component]
      qualifying_evidence:
        request_type: Produce
        request_in_flight: required
        applicable_deadline_governed_by: socket.timeout.ms
        absence_of_earlier_matched_response: required
      expected_sequence:
        - client_request_timeout
        - timeout_driven_disconnect
      subsequent_native_retransmission:
        expected_when: retry_allowance_and_message_lifetime_remain
        retry_queue_insertion_alone_is_sufficient: false
      broker_counters: corroboration_only
      elapsed_time_and_deadline_lateness: recorded
      numeric_timing_pass_fail_tolerance: none
      final_delivery_outcome: recorded_separately
      fully_evidenced_contrary_sequence: contradicted
      missing_or_ambiguous_evidence: inconclusive
      no_qualifying_request: unevaluated

    H3:
      environments: [live, component]
      prediction_kind: experimental_not_source_guaranteed
      qualifying_repeats: H2_timeout_and_native_retry_established
      prediction:
        measurement: verifier.duplicate
        greater_than: 0
        aggregation: across_qualifying_C3_repeats_within_each_environment
      duplicates_required_in_every_repeat: false
      authoritative_assessment: unevaluable_under_current_oracle
      diagnostic_duplicate_witnesses: recorded_only
      absent_diagnostic_witnesses_refute_prediction: false

component_controls:
  required_successful_trials: 5
  evidence:
    - genuine_successful_delivery_callback
    - independent_consumption_of_exact_target_identity
    - complete_control_evidence
  failed_or_incomplete_control_gate: inconclusive_stop_fault_matrix
  application_attempts_per_target: 1
  application_retries: 0
  fault_trial_contradiction: retain_as_finding
  event_hubs_behaviour_claim: none

sources:
  oracle: https://github.com/collaborationwithothers/eventhubs-kafka-dotnet/blob/a27a846/docs/blueprint.md
  scenario_contract: https://github.com/collaborationwithothers/eventhubs-kafka-dotnet/blob/a27a846/docs/operations/scenario-contract.md
  native_configuration: https://github.com/confluentinc/librdkafka/blob/v2.16.0/CONFIGURATION.md
  native_request: https://github.com/confluentinc/librdkafka/blob/v2.16.0/src/rdkafka_request.c
  native_broker: https://github.com/confluentinc/librdkafka/blob/v2.16.0/src/rdkafka_broker.c
  native_retry_semantics: https://github.com/confluentinc/librdkafka/blob/v2.16.0/INTRODUCTION.md
  microsoft_configuration: https://github.com/MicrosoftDocs/azure-docs/blob/c2cc198a3d464afe137f93060257ef06049e0151/articles/event-hubs/apache-kafka-configurations.md
  microsoft_throttling: https://github.com/MicrosoftDocs/azure-docs/blob/c2cc198a3d464afe137f93060257ef06049e0151/articles/event-hubs/apache-kafka-troubleshooting-guide.md
