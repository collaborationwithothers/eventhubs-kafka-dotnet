schema_version: 1
id: A01

assessment_rules:
  live_and_component_evidence: evaluate_separately
  authoritative_verifier_counts: complete_valid_runs_only
  invalid_or_incomplete_run_counts: absent
  missing_counts_are_zero: false
  missing_counts_refute_hypotheses: false
  diagnostic_evidence: retain
  changed_expectations_require_human_approval: true

probe:
  # Approved policy: https://github.com/collaborationwithothers/eventhubs-kafka-dotnet/issues/138#issuecomment-6384660536
  usability:
    required_statistics_coverage: complete_attributed_including_post_drain
    no_positive_throttle_sample: usable_nonqualifying
    absent_throttle_sample: not_a_measured_zero
    absent_sample_references: omitted
    missing_or_incomplete_coverage: inconclusive
  required_usable_repeats: 5
  pass:
    measurement: stats.broker.throttle.max
    role: LoadGenProducer
    greater_than_ms: 20000
    aggregation: any_observation_across_all_five_usable_repeats
  complete_evidence_without_pass: untestable_at_build_scale
  missing_or_unusable_evidence: inconclusive
  oracle_invalidity_alone_invalidates_throttle_evidence: false
  passing_probe_proves_later_hypothesis_prerequisites: false

not_tested:
  H1:
    question: whether Event Hubs honours the producer request.timeout.ms written into each ProduceRequest
    reason: the pinned client cannot attribute a Policy Violation to its own throttle delay, and no source documents whether that response carries a throttle time
    publication: not_decidable_with_pinned_client_evidence

configurations:
  C0:
    H4:
      environments: [live]
      mode: recorded_only
      observation_unit: statistics_window_and_run
      record:
        - delivery_error_codes_per_run
        - req_timeouts_increment_per_window
        - disconnects_increment_per_window
        - throttle_max_per_window
        - rtt_p99_per_window
      per_request_attribution: not_claimed
      pass_fail_expectation: none

  C3:
    H2:
      environments: [component]
      component_latency_ms: 40000
      client_deadlines_ms:
        socket_timeout: 20000
        request_timeout: 60000
        message_timeout: 300000
      evidence: broker_completed_produce_entries_for_trial_partition
      observation_window_ms_after_first_produce: 60000
      holds_when:
        second_produce_on_new_connection_after_first_ms:
          at_least: 20000
          less_than: 40000
        required_fault_trials: 5
      contradicted_when: complete_window_evidence_shows_one_produce_for_trial_partition
      healthy_controls: no_second_produce
      otherwise: inconclusive
      live: recorded_only

    H3:
      environments: [component]
      condition: enable_idempotence_false
      idempotence_question: B04
      qualifying_trials: component_fault_trials_where_H2_held
      holds_when: observer_reads_exactly_two_target_records_in_every_qualifying_trial
      observer_end_watermark: captured_after_observation_window_closes
      contradicted_when: complete_scan_reads_exactly_one_target_record_in_a_qualifying_trial
      negative_scope: bounded_to_observation_window
      otherwise: inconclusive
      live: recorded_only_diagnostic

component_controls:
  required_successful_trials: 5
  evidence:
    - genuine_successful_delivery_callback
    - independent_consumption_of_exact_target_identity
    - complete_control_evidence
  complete_control_evidence:
    delivery_callback: success
    broker_produce_entries_in_window: 1
    observer_target_records: 1
  trial_budget_minutes: 7
  overall_budget_minutes: 90
  failed_or_incomplete_control_gate: inconclusive_stop_fault_matrix
  application_attempts_per_target: 1
  application_retries: 0
  fault_trial_contradiction: retain_as_finding
  event_hubs_behaviour_claim: none

sources:
  oracle: https://github.com/collaborationwithothers/eventhubs-kafka-dotnet/blob/a27a846/docs/blueprint.md
  scenario_contract: https://github.com/collaborationwithothers/eventhubs-kafka-dotnet/blob/a27a846/docs/operations/scenario-contract.md
  native_configuration: https://github.com/confluentinc/librdkafka/blob/v2.16.0/CONFIGURATION.md
  native_request: https://github.com/confluentinc/librdkafka/blob/v2.16.0/src/rdkafka_request.c
  native_broker: https://github.com/confluentinc/librdkafka/blob/v2.16.0/src/rdkafka_broker.c
  native_retry_semantics: https://github.com/confluentinc/librdkafka/blob/v2.16.0/INTRODUCTION.md
  broker_request_log: https://github.com/apache/kafka/blob/3.5/core/src/main/scala/kafka/network/RequestChannel.scala
  broker_request_log_format: https://github.com/apache/kafka/blob/3.5/core/src/main/scala/kafka/network/RequestConvertToJson.scala
  broker_logger_configuration: https://docs.confluent.io/platform/7.5/installation/docker/operations/logging.html
  microsoft_configuration: https://github.com/MicrosoftDocs/azure-docs/blob/c2cc198a3d464afe137f93060257ef06049e0151/articles/event-hubs/apache-kafka-configurations.md
  microsoft_throttling: https://github.com/MicrosoftDocs/azure-docs/blob/c2cc198a3d464afe137f93060257ef06049e0151/articles/event-hubs/apache-kafka-troubleshooting-guide.md
