schema_version: 1
id: B07

assessment_rules:
  authoritative_verifier_counts: complete_valid_runs_only
  invalid_or_incomplete_run_counts: absent
  missing_counts_are_zero: false
  missing_counts_refute_hypotheses: false
  diagnostic_evidence: retain
  changed_expectations_require_human_approval: true
  repeats_per_configuration: 5
  replacement_repeats: 0
  phase_counts_published: only_when_all_five_repeats_complete_valid
  measures_source: "batching_recorded_evidence and counts in each repeat of the C0 and C1 phase candidates (docs/operations/verifier-contract.md, C5 phase, blob and receipt contract)"
  messages_per_request: "per repeat, ok divided by produce_requests, computed by script; absent when either is absent or produce_requests is 0"
  offered_rate_limit: "the saturation-ramp profile offers a fixed rate, so these measures describe batching and latency at that rate, not the maximum rate a producer reaches (split adoption decision 3)"
  judgement_contract: docs/operations/verifier-contract.md#c5-phase-blob-and-receipt-contract

hypotheses:
  H_lowest_latency:
    question: "Does linger.ms=0 give lower delivery latency than the baseline linger.ms=5?"
    configurations: [C0, C1]
    decision: "holds when C0 and C1 each have five complete_valid repeats with latency_p50_us present in every repeat and the largest C1 latency_p50_us is below the smallest C0 latency_p50_us; contradicted when the same evidence is complete and the smallest C1 latency_p50_us is above the largest C0 latency_p50_us; otherwise inconclusive"
  H_batching:
    question: "Does linger.ms=5 build fewer, larger Produce requests than linger.ms=0 at the offered rate?"
    configurations: [C0, C1]
    decision: "recorded_only; per repeat produce_requests, messages_per_request, batch_count and batch_max_messages for C0 and C1, and their medians over five repeats"
  H_tail:
    question: "How do latency_p95_us and latency_max_us differ between C0 and C1?"
    configurations: [C0, C1]
    decision: "recorded_only"

verdict:
  decision: "confirmed when H_lowest_latency holds; contradicted when it is contradicted; untestable when it is inconclusive"
  basis: "Microsoft's troubleshooting table, which carries no client label: High latency spikes, Reduce linger.ms value (use 0 for lowest latency). The Java table's Increase for high-throughput scenarios does not apply to a librdkafka client (ADR-015) and is recorded only, under H_batching"
  precedence: "smoke run -> null, `smoke_only`; a missing candidate or a configuration not `complete_valid` -> null, `incomplete_configuration`; then the item rule"
  no_verdict_when: "smoke run, incomplete or missing configuration; no pooling or replacement repeats"
  text_must_state: "the per-repeat latency_p50_us of both configurations and their medians; the measures describe batching and latency at the profile's offered rate, not maximum throughput; delivery latency is application callback latency, not wire latency; workload data is synthetic"

sources:
- url: https://learn.microsoft.com/en-us/azure/event-hubs/apache-kafka-configurations
  version: current
  read_date: "2026-11-04"
