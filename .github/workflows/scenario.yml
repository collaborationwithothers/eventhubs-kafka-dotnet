      - name: Use the initial job's immutable worker images
        id: images
        shell: bash
        env:
          LOADGEN_DIGEST: ${{ needs.probe.outputs.loadgen_digest }}
          VERIFIER_DIGEST: ${{ needs.probe.outputs.verifier_digest }}
        run: bash infra/scripts/phase/phase.sh use-images "$LOADGEN_DIGEST" "$VERIFIER_DIGEST"
      - name: Initialize cluster state
