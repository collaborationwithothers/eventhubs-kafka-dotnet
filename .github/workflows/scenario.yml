        env:
          PROBE_RESULT: ${{ needs.probe.result }}
          FULL_ALLOWED: ${{ needs.probe.outputs.full_allowed }}
          FULL_C0_RESULT: ${{ needs.full-C0.result }}
          LOADGEN_DIGEST: ${{ needs.probe.outputs.loadgen_digest }}
          VERIFIER_DIGEST: ${{ needs.probe.outputs.verifier_digest }}
        run: |
          case "$PARCHWELL_SCENARIO" in
            A01) bash infra/scripts/phase/phase.sh allow-c3 ;;
            B04) bash infra/scripts/phase/phase.sh allow-images ;;
