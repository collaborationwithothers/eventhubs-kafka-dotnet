      - name: Apply the saved cluster plan
        id: cluster_apply
        if: steps.allowed.outputs.workload == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf 'attempted=true\n' >> "$GITHUB_OUTPUT"
          bash infra/scripts/lifecycle/lifecycle.sh apply-cluster
      - name: Initialize ephemeral state
        id: ephemeral_init
        if: steps.allowed.outputs.workload == 'true'
        shell: bash
        run: bash infra/scripts/lifecycle/lifecycle.sh init-ephemeral
      - name: Plan ephemeral infrastructure
        id: ephemeral_plan
        if: steps.allowed.outputs.workload == 'true'
        shell: bash
        run: bash infra/scripts/lifecycle/lifecycle.sh plan-ephemeral
      - name: Apply the saved ephemeral plan
        id: ephemeral_apply
        if: steps.allowed.outputs.workload == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf 'attempted=true\n' >> "$GITHUB_OUTPUT"
          bash infra/scripts/lifecycle/lifecycle.sh apply-ephemeral
      - name: Require private endpoint DNS answers
        id: dns
        if: steps.allowed.outputs.workload == 'true'
        shell: bash
        run: bash infra/scripts/phase/phase.sh check-dns
      - name: Get cluster credentials
        id: credentials
        if: steps.allowed.outputs.workload == 'true'
        shell: bash
        run: bash infra/scripts/lifecycle/lifecycle.sh credentials
      - name: Reset the parchwell namespace
        id: namespace
        if: steps.allowed.outputs.workload == 'true'
        shell: bash
        run: bash infra/scripts/lifecycle/lifecycle.sh reset-namespace
      - name: Run all five repeat slots
        id: repeats
        if: steps.allowed.outputs.workload == 'true'
        shell: bash
        run: bash infra/scripts/phase/phase.sh run-repeats
      - name: Run the phase judge
        id: judge
        if: always() && !cancelled() && steps.namespace.outcome == 'success'
        shell: bash
        run: bash infra/scripts/phase/phase.sh judge
      - name: Retrieve and check the phase candidate
        id: candidate
        if: always() && !cancelled() && steps.namespace.outcome == 'success'
        shell: bash
        run: bash infra/scripts/phase/phase.sh candidate
      - name: Upload the phase candidate
        id: upload_candidate
        if: always() && steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 5
        with:
          name: ${{ inputs.scenario == 'B04' && 'b04-C1' || 'a01-C3' }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PARCHWELL_CANDIDATE_DIRECTORY }}/candidate.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload public pod evidence
        id: upload_pods
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 5
        with:
          name: ${{ inputs.scenario == 'B04' && 'b04-C1' || 'a01-C3' }}-pods-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PARCHWELL_ARTIFACT_DIRECTORY }}
          retention-days: 90
          if-no-files-found: error
      - name: Delete this run's worker Jobs
        id: delete_workload
        if: always() && steps.prepare.outcome == 'success' && steps.azure_session.outcome == 'success' && steps.credentials.outcome == 'success'
        shell: bash
        run: bash infra/scripts/phase/phase.sh delete-workload
      - name: Destroy ephemeral infrastructure
        id: destroy
        if: always() && steps.prepare.outcome == 'success' && steps.azure_session.outcome == 'success'
        shell: bash
        run: bash infra/scripts/lifecycle/lifecycle.sh destroy-ephemeral
      - name: Stop the cluster at dispatch end
        id: stop
        if: always() && steps.stop_prepare.outcome == 'success' && steps.azure_session.outcome == 'success'
        shell: bash
        env:
          STOP_PRIVATE_DIRECTORY: ${{ steps.stop_prepare.outputs.private_directory }}
        run: PARCHWELL_PRIVATE_DIRECTORY="$STOP_PRIVATE_DIRECTORY" bash infra/scripts/lifecycle/lifecycle.sh stop-cluster
      - name: Report the phase and cleanup outcomes
        id: report
        if: always()
        shell: bash
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          WORKLOAD: ${{ steps.allowed.outputs.workload }}
          REQUIRED_STEPS: guard checkout select allowed stop_prepare azure_session stop
          WORKLOAD_STEPS: tools prepare images cluster_init start cluster_plan cluster_apply ephemeral_init ephemeral_plan ephemeral_apply dns credentials namespace repeats judge candidate upload_candidate upload_pods delete_workload destroy
        run: bash infra/scripts/phase/phase.sh report
  batch:
    if: inputs.scenario == 'probe-batch'
    runs-on: ${{ vars.PARCHWELL_RUNNER_LABEL }}
    environment: parchwell-scenarios
    timeout-minutes: 360
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      PARCHWELL_CLUSTER_RESOURCE_ID: ${{ vars.PARCHWELL_CLUSTER_RESOURCE_ID }}
      PARCHWELL_SCENARIO: probe-batch
      PARCHWELL_PHASE: single-action
      PARCHWELL_RUN_KIND: ${{ inputs.run_kind }}
    steps:
      - name: Require the main branch before login
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          for value in "$AZURE_CLIENT_ID" "$AZURE_TENANT_ID" "$AZURE_SUBSCRIPTION_ID"; do
            [[ "$value" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
            echo "::add-mask::$value"
          done
      - name: Check out the main head this run started from
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the probe batch run kind
        id: select
        shell: bash
        run: python3 infra/scripts/phase/phase.py validate-batch
      - name: Install the pinned Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Install and verify pinned lifecycle tools
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info >= (3, 10)'
          bash infra/scripts/lifecycle/install-tools.sh "$RUNNER_TEMP/parchwell-lifecycle-tools" live
          printf '%s\n' "$RUNNER_TEMP/parchwell-lifecycle-tools" >> "$GITHUB_PATH"
      - name: Set up pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Materialise and validate private batch inputs
        id: prepare
        shell: bash
        env:
          S_CLUSTER_BACKEND: ${{ secrets.PARCHWELL_CLUSTER_BACKEND }}
          S_CLUSTER_TFVARS: ${{ secrets.PARCHWELL_CLUSTER_TFVARS }}
          S_EPHEMERAL_BACKEND: ${{ secrets.PARCHWELL_EPHEMERAL_BACKEND }}
          S_EPHEMERAL_TFVARS: ${{ secrets.PARCHWELL_EPHEMERAL_TFVARS }}
          S_PERSISTENT_OUTPUTS: ${{ secrets.PARCHWELL_PERSISTENT_OUTPUTS }}
        run: bash infra/scripts/phase/phase.sh prepare-batch
      - name: Existing environment OIDC login
        id: login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Enable renewable serialized Azure CLI session
        id: azure_session
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          real_az="$(command -v az)"
          test -x "$real_az"
          session_dir="$(mktemp -d "$RUNNER_TEMP/a01-oidc.XXXXXX")"
          chmod 700 "$session_dir"
          test -x "$GITHUB_WORKSPACE/scripts/azure-cli-session/az"
          printf 'PARCHWELL_REAL_AZ=%s\n' "$real_az" >> "$GITHUB_ENV"
          printf 'PARCHWELL_AZ_SESSION_DIRECTORY=%s\n' "$session_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_WORKSPACE/scripts/azure-cli-session" >> "$GITHUB_PATH"
      - name: Publish full-SHA worker images and record registry digests
        id: images
        shell: bash
        run: bash infra/scripts/phase/phase.sh publish-images
      - name: Initialize cluster state
        id: cluster_init
        shell: bash
        run: bash infra/scripts/lifecycle/lifecycle.sh init-cluster
      - name: Start the existing cluster
        id: start
        shell: bash
        run: |
          set -euo pipefail
          printf 'attempted=true\n' >> "$GITHUB_OUTPUT"
          bash infra/scripts/lifecycle/lifecycle.sh start-cluster
      - name: Plan cluster infrastructure
        id: cluster_plan
        shell: bash
        run: bash infra/scripts/lifecycle/lifecycle.sh plan-cluster
      - name: Apply the saved cluster plan
        id: cluster_apply
        shell: bash
        run: |
          set -euo pipefail
          printf 'attempted=true\n' >> "$GITHUB_OUTPUT"
          bash infra/scripts/lifecycle/lifecycle.sh apply-cluster
      - name: Initialize ephemeral state
        id: ephemeral_init
        shell: bash
        run: bash infra/scripts/lifecycle/lifecycle.sh init-ephemeral
      - name: Plan ephemeral infrastructure
        id: ephemeral_plan
        shell: bash
        run: bash infra/scripts/lifecycle/lifecycle.sh plan-ephemeral
      - name: Apply the saved ephemeral plan
        id: ephemeral_apply
        shell: bash
        run: |
          set -euo pipefail
          printf 'attempted=true\n' >> "$GITHUB_OUTPUT"
          bash infra/scripts/lifecycle/lifecycle.sh apply-ephemeral
      - name: Require private endpoint DNS answers
        id: dns
        shell: bash
        run: bash infra/scripts/phase/phase.sh check-dns
      - name: Get cluster credentials
        id: credentials
        shell: bash
        run: bash infra/scripts/lifecycle/lifecycle.sh credentials
      - name: Reset the parchwell namespace
        id: namespace
        shell: bash
        run: bash infra/scripts/lifecycle/lifecycle.sh reset-namespace
      - name: Smoke the separate F04 seed path
        id: seed
        shell: bash
        run: bash infra/scripts/phase/phase.sh single-action-seed
      - name: Smoke every action and judge path
        id: batch
        shell: bash
        run: bash infra/scripts/phase/phase.sh run-single-action-batch
      - name: Upload public pod evidence
        id: upload_pods
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 5
        with:
          name: probe-batch-smoke-pods-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PARCHWELL_ARTIFACT_DIRECTORY }}
          retention-days: 90
          if-no-files-found: error
      - name: Delete this run's worker Jobs
        id: delete_workload
        if: always() && steps.prepare.outcome == 'success' && steps.azure_session.outcome == 'success' && steps.credentials.outcome == 'success'
        shell: bash
        run: bash infra/scripts/phase/phase.sh delete-workload
      - name: Destroy ephemeral infrastructure
        id: destroy
        if: always() && steps.prepare.outcome == 'success' && steps.azure_session.outcome == 'success'
        shell: bash
        run: bash infra/scripts/lifecycle/lifecycle.sh destroy-ephemeral
      - name: Report the phase and cleanup outcomes
        id: report
        if: always()
        shell: bash
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          WORKLOAD: 'true'
          REQUIRED_STEPS: guard checkout select tools prepare azure_session
          WORKLOAD_STEPS: images cluster_init start cluster_plan cluster_apply ephemeral_init ephemeral_plan ephemeral_apply dns credentials namespace seed batch upload_pods delete_workload destroy
        run: bash infra/scripts/phase/phase.sh report
  batch-stop:
    needs: [batch]
    if: always() && inputs.scenario == 'probe-batch' && inputs.run_kind == 'smoke'
