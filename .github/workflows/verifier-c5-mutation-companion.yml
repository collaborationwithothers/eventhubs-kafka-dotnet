    env:
      C5_OUTPUT: ${{ github.workspace }}/.artifacts/c5-mutation/${{ matrix.shard }}
    steps:
      - name: Check out measured commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Restore pinned mutation tool
        run: dotnet tool restore
      - name: Measure one C5 target
        env:
          C5_SHARD: ${{ matrix.shard }}
          C5_SUITE: ${{ inputs.suite }}
        run: python3 tests/Parchwell.Verifier.Tests/Mutation/c5_workflow.py run-shard --shard "$C5_SHARD" --output-dir "$C5_OUTPUT" --suite "$C5_SUITE"
      - name: Retain shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c5-mutation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            ${{ env.C5_OUTPUT }}
            !${{ env.C5_OUTPUT }}/stryker/logs/**
          if-no-files-found: error
          retention-days: 90
      - name: Retain shard Stryker logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c5-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ env.C5_OUTPUT }}/stryker/logs
          if-no-files-found: ignore
          retention-days: 90
