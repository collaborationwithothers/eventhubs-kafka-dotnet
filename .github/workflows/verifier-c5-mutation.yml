name: C5 verifier mutation

on:
  workflow_dispatch:
    inputs:
      companion_run_id:
        description: Companion workflow run ID on the same main commit
        required: true
        type: string
      companion_run_attempt:
        description: Companion workflow attempt number
        required: true
        type: string

permissions:
  contents: read

jobs:
