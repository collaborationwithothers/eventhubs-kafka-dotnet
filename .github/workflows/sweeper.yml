# Installed at .github/workflows/sweeper.yml; committed copy at docs/operations/workflows/sweeper.yml.txt; the two are byte-identical (AGENTS.md hard safety rule 8).
name: Destroy-only lifecycle sweeper
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: parchwell-ephemeral
  queue: max
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ${{ vars.PARCHWELL_RUNNER_LABEL }}
    environment: parchwell-sweeper
    timeout-minutes: 120
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      PARCHWELL_CLUSTER_RESOURCE_ID: ${{ vars.PARCHWELL_CLUSTER_RESOURCE_ID }}
    steps:
      - name: Require the main branch before login
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          for value in "$AZURE_CLIENT_ID" "$AZURE_TENANT_ID" "$AZURE_SUBSCRIPTION_ID"; do
            [[ "$value" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
            echo "::add-mask::$value"
          done
      - name: Check out the main head this run started from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the pinned Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Install and verify pinned lifecycle tools
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info >= (3, 10)'
          bash infra/scripts/lifecycle/install-tools.sh "$RUNNER_TEMP/parchwell-lifecycle-tools" live
          printf '%s\n' "$RUNNER_TEMP/parchwell-lifecycle-tools" >> "$GITHUB_PATH"
      - name: Materialise private inputs and require lifecycle prerequisites
        id: prepare
        shell: bash
        env:
          S_EPHEMERAL_BACKEND: ${{ secrets.PARCHWELL_EPHEMERAL_BACKEND }}
          S_EPHEMERAL_TFVARS: ${{ secrets.PARCHWELL_EPHEMERAL_TFVARS }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYTHON'
          import os, pathlib, re, tempfile
          resource_id = os.environ['PARCHWELL_CLUSTER_RESOURCE_ID']
          assert re.fullmatch(r'/subscriptions/[0-9a-fA-F-]{36}/resourceGroups/[^/\r\n]+/providers/Microsoft.ContainerService/managedClusters/[^/\r\n]+', resource_id), 'Missing or invalid AKS resource ID'
          private = pathlib.Path(tempfile.mkdtemp(prefix='parchwell-private-', dir=os.environ['RUNNER_TEMP']))
          settings = {'PARCHWELL_PRIVATE_DIRECTORY': str(private)}
          value = os.environ['S_EPHEMERAL_BACKEND']
          assert value, 'Missing EPHEMERAL_BACKEND secret'
          path = private / 'ephemeral_backend.hcl'
          path.write_text(value + '\n')
          path.chmod(0o600)
          settings['PARCHWELL_EPHEMERAL_BACKEND_CONFIG'] = str(path)
          value = os.environ['S_EPHEMERAL_TFVARS']
          assert value, 'Missing EPHEMERAL_TFVARS secret'
          path = private / 'ephemeral_tfvars.tfvars.json'
          path.write_text(value + '\n')
          path.chmod(0o600)
          settings['PARCHWELL_EPHEMERAL_TFVARS_PATH'] = str(path)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in settings.items():
                  assert '\n' not in value and '\r' not in value
                  output.write(f'{key}={value}\n')
          PYTHON
      - name: Existing environment OIDC login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Enable renewable serialized Azure CLI session
        id: azure_session
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          real_az="$(command -v az)"
          test -x "$real_az"
          session_dir="$(mktemp -d "$RUNNER_TEMP/a01-oidc.XXXXXX")"
          chmod 700 "$session_dir"
          test -x "$GITHUB_WORKSPACE/scripts/azure-cli-session/az"
          printf 'PARCHWELL_REAL_AZ=%s\n' "$real_az" >> "$GITHUB_ENV"
          printf 'PARCHWELL_AZ_SESSION_DIRECTORY=%s\n' "$session_dir" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_WORKSPACE/scripts/azure-cli-session" >> "$GITHUB_PATH"
      - name: Read dispatch activity and end time
        id: history
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 infra/scripts/lifecycle/dispatch-state.py
      - name: Destroy idle ephemeral infrastructure
        id: destroy
        if: always() && steps.prepare.outcome == 'success' && steps.azure_session.outcome == 'success' && steps.history.outputs.idle == 'true'
        shell: bash
        run: bash infra/scripts/lifecycle/lifecycle.sh destroy-ephemeral
      - name: Stop idle AKS cluster
        id: stop
        if: always() && steps.prepare.outcome == 'success' && steps.azure_session.outcome == 'success' && steps.history.outputs.stop_eligible == 'true'
        shell: bash
        run: bash infra/scripts/lifecycle/lifecycle.sh stop-cluster
      - name: Report cleanup and deferred work
        if: always()
        shell: bash
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          steps = json.loads(os.environ['STEP_RESULTS'])
          history = steps.get('history', {}).get('outputs', {})
          lines = ['## Lifecycle sweeper', 'Idle proven: ' + history.get('idle', 'unknown'), 'Stop eligible: ' + history.get('stop_eligible', 'unknown')]
          if history.get('idle') != 'true':
              lines.append('Cleanup deferred: active dispatch or unknown activity history; see lookup log.')
          elif history.get('stop_eligible') != 'true':
              lines.append('AKS stop deferred: threshold not reached or dispatch end unknown; see lookup log.')
          for name in ('history', 'destroy', 'stop'):
              lines.append(name + ': ' + steps.get(name, {}).get('outcome', 'missing'))
          report = '\n'.join(lines) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(report)
          failed = os.environ['JOB_STATUS'] != 'success' or any(step.get('outcome') in ('failure', 'cancelled') for step in steps.values())
          sys.exit(1 if failed else 0)
          PYTHON
