name: .NET verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-tests:
    name: .NET tests (${{ matrix.project }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project:
          - Parchwell.ArchitectureTests
          - Parchwell.Enrichment.Tests
          - Parchwell.Kafka.Tests
          - Parchwell.LoadGen.Tests
          - Parchwell.Scenarios.Tests
          - Parchwell.Verifier.Tests
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify .NET test project
        env:
          PARCHWELL_TEST_PROJECT: ${{ matrix.project }}
        run: ./scripts/verify-dotnet.sh --project "$PARCHWELL_TEST_PROJECT"
      - name: Install mapping coverage collector
        if: matrix.project == 'Parchwell.Kafka.Tests'
        run: dotnet tool install dotnet-coverage --version 18.12.0 --tool-path "$RUNNER_TEMP/parchwell-coverage"
      - name: Verify Kafka mapping coverage
        if: matrix.project == 'Parchwell.Kafka.Tests'
        run: ./scripts/verify-kafka-coverage.sh "$RUNNER_TEMP/parchwell-coverage/dotnet-coverage"
      - name: Record passed test job
        run: mkdir -p "$RUNNER_TEMP/dotnet-verification-artifact" && touch "$RUNNER_TEMP/dotnet-verification-artifact/leg-passed"
      - name: Collect verification reports
        if: always()
        env:
          PARCHWELL_TEST_PROJECT: ${{ matrix.project }}
        shell: bash
        run: |
          artifact="$RUNNER_TEMP/dotnet-verification-artifact"
          mkdir -p "$artifact"
          shopt -s nullglob
          results_dirs=("${TMPDIR:-/tmp}"/parchwell-dotnet-verification.*)
          if [ "${#results_dirs[@]}" -ne 1 ]; then
            echo "Expected one verification results directory; found ${#results_dirs[@]}." >&2
            exit 1
          fi
          results_dir=${results_dirs[0]}
          for name in summary.json stage-timing.tsv unit-projects.txt; do
            if [ -f "$results_dir/$name" ]; then
              cp "$results_dir/$name" "$artifact/$name"
            fi
          done
          if [ -f "$results_dir/$PARCHWELL_TEST_PROJECT/results.xml" ]; then
            cp "$results_dir/$PARCHWELL_TEST_PROJECT/results.xml" "$artifact/results.xml"
          fi
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dotnet-verification-${{ matrix.project }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dotnet-verification-artifact
          if-no-files-found: error
  worker-images:
    name: Worker image smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify worker images start
        run: ./scripts/verify-worker-images.sh
  dotnet-verification:
    name: .NET verification
    needs: [dotnet-tests, worker-images]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test the aggregate checker
        run: python3 -m unittest discover -s scripts/tests -p test_check_dotnet_matrix.py -v
      - name: Download verification reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dotnet-verification-*
          path: ${{ runner.temp }}/dotnet-verification-reports
          merge-multiple: false
      - name: Check every test project passed
        if: always()
        env:
          DOTNET_TESTS_RESULT: ${{ needs.dotnet-tests.result }}
          WORKER_IMAGES_RESULT: ${{ needs.worker-images.result }}
        run: python3 scripts/check-dotnet-matrix.py "$RUNNER_TEMP/dotnet-verification-reports" "dotnet-tests=$DOTNET_TESTS_RESULT" "worker-images=$WORKER_IMAGES_RESULT"
  lifecycle-verification:
    name: Lifecycle verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install and verify pinned offline tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info >= (3, 10); assert sys.version_info[:2] == (3, 12)'
          export PARCHWELL_TOOLS_DIRECTORY="$RUNNER_TEMP/parchwell-lifecycle-tools"
          log="$RUNNER_TEMP/parchwell-offline-tools-install.log"
          if bash infra/scripts/lifecycle/install-tools.sh "$PARCHWELL_TOOLS_DIRECTORY" ci 2>&1 | tee "$log"; then
            printf 'PARCHWELL_TOOLS_DIRECTORY=%s\n' "$PARCHWELL_TOOLS_DIRECTORY" >> "$GITHUB_ENV"
            printf '%s\n' "$PARCHWELL_TOOLS_DIRECTORY" "$PARCHWELL_TOOLS_DIRECTORY/venv/bin" >> "$GITHUB_PATH"
          else
            status=$?
            printf '::error::Pinned offline tools installation failed (exit %s). See the run summary and installation log artifact.\n' "$status"
            {
              printf '### Pinned offline tools installation failed (exit %s)\n\n' "$status"
              printf '```text\n'
              tail -n 80 "$log"
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
      - name: Upload failed pinned-tool installation log
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-tools-install-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parchwell-offline-tools-install.log
          if-no-files-found: ignore
      - name: Verify lifecycle with stub commands
        shell: bash
        run: python3 infra/scripts/lifecycle/command.py 600 -- python3 -m unittest discover -s infra/scripts/tests -p 'test_*.py'
      - name: Verify renewable Azure CLI session
        shell: bash
        run: python3 infra/scripts/lifecycle/command.py 60 -- python3 -m unittest discover -s scripts/tests -p test_azure_cli_session.py -v
      - name: Verify shell, workflows and rendered Kubernetes schemas
        shell: bash
        run: python3 infra/scripts/lifecycle/command.py 600 -- bash infra/scripts/lifecycle/check-offline.sh
      - name: Verify the load generator accepts the rendered chart environment
        shell: bash
        run: python3 infra/scripts/lifecycle/command.py 900 -- bash charts/parchwell/tests/check-loadgen-host.sh
  terraform-verification:
    name: Terraform verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install and verify pinned offline tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info >= (3, 10); assert sys.version_info[:2] == (3, 12)'
          export PARCHWELL_TOOLS_DIRECTORY="$RUNNER_TEMP/parchwell-lifecycle-tools"
          log="$RUNNER_TEMP/parchwell-offline-tools-install.log"
          if bash infra/scripts/lifecycle/install-tools.sh "$PARCHWELL_TOOLS_DIRECTORY" ci 2>&1 | tee "$log"; then
            printf 'PARCHWELL_TOOLS_DIRECTORY=%s\n' "$PARCHWELL_TOOLS_DIRECTORY" >> "$GITHUB_ENV"
            printf '%s\n' "$PARCHWELL_TOOLS_DIRECTORY" "$PARCHWELL_TOOLS_DIRECTORY/venv/bin" >> "$GITHUB_PATH"
          else
            status=$?
            printf '::error::Pinned offline tools installation failed (exit %s). See the run summary and installation log artifact.\n' "$status"
            {
              printf '### Pinned offline tools installation failed (exit %s)\n\n' "$status"
              printf '```text\n'
              tail -n 80 "$log"
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
      - name: Upload failed pinned-tool installation log
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-tools-install-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parchwell-offline-tools-install.log
          if-no-files-found: ignore
      - name: Check Terraform formatting
        shell: bash
        run: python3 infra/scripts/lifecycle/command.py 600 -- terraform fmt -check -recursive infra tests/terraform
      - name: Require canonical nonempty root-local mock tests
        shell: bash
        run: python3 infra/scripts/lifecycle/command.py 600 -- bash infra/scripts/lifecycle/check-offline.sh --terraform-test-paths
      - name: Validate and test every existing Terraform root without Azure identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE"
          for root in persistent ephemeral cluster; do
            if [ ! -d "infra/$root" ]; then
              if [ "$root" = cluster ]; then
                echo 'C1 prerequisite pending: infra/cluster is absent; no cluster check passed.'
                continue
              fi
              echo "Missing required Terraform root: $root" >&2
              exit 1
            fi
            python3 infra/scripts/lifecycle/command.py 600 -- terraform -chdir="infra/$root" init -backend=false -input=false -lockfile=readonly
            python3 infra/scripts/lifecycle/command.py 600 -- terraform -chdir="infra/$root" validate
            python3 infra/scripts/lifecycle/command.py 600 -- tflint --chdir="infra/$root" --config="$repository/.tflint.hcl" --init
            python3 infra/scripts/lifecycle/command.py 600 -- tflint --chdir="infra/$root" --config="$repository/.tflint.hcl"
            python3 infra/scripts/lifecycle/command.py 600 -- terraform -chdir="infra/$root" test -test-directory=tests -no-color
          done
