name: check-docs

on:
  # This checks a snapshot of competing ADR allocations. Repository-wide
  # invalidation and merge-time revalidation are tracked in issue #48.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -B scripts/tests/check_docs_test.py
      - run: python3 -B scripts/check_docs.py
        env:
          GH_TOKEN: ${{ github.token }}
