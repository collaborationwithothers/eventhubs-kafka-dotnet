name: C5 hosted timing diagnostic

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full lowercase commit SHA containing the diagnostic helpers
        required: true
        type: string
        default: 3c65a2fa52f16378c3815159cd07f8237e3346bf

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: b10-final-projection-codec-p4
            target: Common/Phase/B10FinalProjectionCodec.cs
            target_sha256: 43b65bb7b91010a7bf1b97343ce8c134c686ea9c2d4d973f8e284fa4bcfdcf4f
          - shard: b10-final-projection-codec-p5
            target: Common/Phase/B10FinalProjectionCodec.cs
            target_sha256: 43b65bb7b91010a7bf1b97343ce8c134c686ea9c2d4d973f8e284fa4bcfdcf4f
          - shard: b10-final-projection-codec-p6
            target: Common/Phase/B10FinalProjectionCodec.cs
            target_sha256: 43b65bb7b91010a7bf1b97343ce8c134c686ea9c2d4d973f8e284fa4bcfdcf4f
          - shard: b10-final-projection-codec-p7
            target: Common/Phase/B10FinalProjectionCodec.cs
            target_sha256: 43b65bb7b91010a7bf1b97343ce8c134c686ea9c2d4d973f8e284fa4bcfdcf4f
          - shard: b10-final-projection-codec-p8
            target: Common/Phase/B10FinalProjectionCodec.cs
            target_sha256: 43b65bb7b91010a7bf1b97343ce8c134c686ea9c2d4d973f8e284fa4bcfdcf4f
          - shard: b10-final-projection-codec-p9
            target: Common/Phase/B10FinalProjectionCodec.cs
            target_sha256: 43b65bb7b91010a7bf1b97343ce8c134c686ea9c2d4d973f8e284fa4bcfdcf4f
          - shard: b10-final-projection-codec-p10
            target: Common/Phase/B10FinalProjectionCodec.cs
            target_sha256: 43b65bb7b91010a7bf1b97343ce8c134c686ea9c2d4d973f8e284fa4bcfdcf4f
          - shard: b10-final-projection-codec-p11
            target: Common/Phase/B10FinalProjectionCodec.cs
            target_sha256: 43b65bb7b91010a7bf1b97343ce8c134c686ea9c2d4d973f8e284fa4bcfdcf4f
          - shard: b10-final-projection-codec-p12
            target: Common/Phase/B10FinalProjectionCodec.cs
            target_sha256: 43b65bb7b91010a7bf1b97343ce8c134c686ea9c2d4d973f8e284fa4bcfdcf4f
          - shard: b10-final-projection-codec-p13
            target: Common/Phase/B10FinalProjectionCodec.cs
            target_sha256: 43b65bb7b91010a7bf1b97343ce8c134c686ea9c2d4d973f8e284fa4bcfdcf4f
          - shard: b10-final-projection-codec-p14
            target: Common/Phase/B10FinalProjectionCodec.cs
            target_sha256: 43b65bb7b91010a7bf1b97343ce8c134c686ea9c2d4d973f8e284fa4bcfdcf4f
          - shard: b10-final-projection-codec-p15
            target: Common/Phase/B10FinalProjectionCodec.cs
            target_sha256: 43b65bb7b91010a7bf1b97343ce8c134c686ea9c2d4d973f8e284fa4bcfdcf4f
          - shard: b10-final-projection-codec-crossing
            target: Common/Phase/B10FinalProjectionCodec.cs
            target_sha256: 43b65bb7b91010a7bf1b97343ce8c134c686ea9c2d4d973f8e284fa4bcfdcf4f
          - shard: b10-final-judge-p1
            target: Judge/B10FinalJudge.cs
            target_sha256: e37f0604e2483e2c54f73006dca1e6fc68f5ee5e422a660ecd18f94f0240967a
          - shard: b10-final-judge-p2
            target: Judge/B10FinalJudge.cs
            target_sha256: e37f0604e2483e2c54f73006dca1e6fc68f5ee5e422a660ecd18f94f0240967a
          - shard: b10-final-judge-p3
            target: Judge/B10FinalJudge.cs
            target_sha256: e37f0604e2483e2c54f73006dca1e6fc68f5ee5e422a660ecd18f94f0240967a
          - shard: b10-final-judge-p4
            target: Judge/B10FinalJudge.cs
            target_sha256: e37f0604e2483e2c54f73006dca1e6fc68f5ee5e422a660ecd18f94f0240967a
          - shard: b10-final-judge-p5
            target: Judge/B10FinalJudge.cs
            target_sha256: e37f0604e2483e2c54f73006dca1e6fc68f5ee5e422a660ecd18f94f0240967a
          - shard: b10-final-judge-p6
            target: Judge/B10FinalJudge.cs
            target_sha256: e37f0604e2483e2c54f73006dca1e6fc68f5ee5e422a660ecd18f94f0240967a
          - shard: b10-final-judge-p7
            target: Judge/B10FinalJudge.cs
            target_sha256: e37f0604e2483e2c54f73006dca1e6fc68f5ee5e422a660ecd18f94f0240967a
          - shard: b10-final-judge-p8
            target: Judge/B10FinalJudge.cs
            target_sha256: e37f0604e2483e2c54f73006dca1e6fc68f5ee5e422a660ecd18f94f0240967a
          - shard: b10-final-judge-p9
            target: Judge/B10FinalJudge.cs
            target_sha256: e37f0604e2483e2c54f73006dca1e6fc68f5ee5e422a660ecd18f94f0240967a
          - shard: b10-final-judge-p10
            target: Judge/B10FinalJudge.cs
            target_sha256: e37f0604e2483e2c54f73006dca1e6fc68f5ee5e422a660ecd18f94f0240967a
          - shard: b10-final-judge-p11
            target: Judge/B10FinalJudge.cs
            target_sha256: e37f0604e2483e2c54f73006dca1e6fc68f5ee5e422a660ecd18f94f0240967a
          - shard: b10-final-judge-p12
            target: Judge/B10FinalJudge.cs
            target_sha256: e37f0604e2483e2c54f73006dca1e6fc68f5ee5e422a660ecd18f94f0240967a
          - shard: b10-final-judge-crossing
            target: Judge/B10FinalJudge.cs
            target_sha256: e37f0604e2483e2c54f73006dca1e6fc68f5ee5e422a660ecd18f94f0240967a
          - shard: verifier-result-codec-p8
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p9
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p10
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p11
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p12
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p13
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p14
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p18
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p19
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p20
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p21
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p22
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p23
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p24
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p25
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-p26
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
          - shard: verifier-result-codec-crossing
            target: Common/Results/VerifierResultCodec.cs
            target_sha256: 8526a0adbb9e5ac1cac4c92177377616d2768c003fa7d91338d231d99baa8dba
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SHARD: ${{ matrix.shard }}
      TARGET: ${{ matrix.target }}
      TARGET_SHA256: ${{ matrix.target_sha256 }}
    steps:
      - name: Initialize evidence and validate dispatch
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTIC_DIR="$RUNNER_TEMP/c5-sizing"
          printf 'DIAGNOSTIC_DIR=%s\n' "$DIAGNOSTIC_DIR" >> "$GITHUB_ENV"
          mkdir -p "$DIAGNOSTIC_DIR"
          printf 'incomplete\n' > "$DIAGNOSTIC_DIR/status.txt"
          {
            printf 'purpose=diagnostic; not acceptance or qualification\n'
            printf 'workflow_sha=%s\nworkflow_ref=%s\nsource_sha=%s\n' "$GITHUB_SHA" "$GITHUB_REF" "$SOURCE_SHA"
            printf 'run_id=%s\nrun_attempt=%s\nshard=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SHARD"
            printf 'runner_os=%s\nrunner_arch=%s\nimage_os=%s\nimage_version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            uname -a
            lscpu
            for file in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us; do
              if [[ -r "$file" ]]; then printf '%s: ' "$file"; cat "$file"; fi
            done
          } > "$DIAGNOSTIC_DIR/metadata.txt"
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$SOURCE_SHA" == 3c65a2fa52f16378c3815159cd07f8237e3346bf ]]
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          printf '%s  %s\n' "$TARGET_SHA256" "src/Parchwell.Verifier/$TARGET" | sha256sum --check
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Restore and preflight
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info > "$DIAGNOSTIC_DIR/dotnet-info.txt" 2>&1
          dotnet tool restore 2>&1 | tee "$DIAGNOSTIC_DIR/tool-restore.log"
          dotnet restore Parchwell.slnx --locked-mode -m:1 2>&1 | tee "$DIAGNOSTIC_DIR/restore.log"
          dotnet stryker --help 2>&1 | tee "$DIAGNOSTIC_DIR/stryker-help.log"
          git diff --quiet && git diff --cached --quiet
      - name: Measure physical shard
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 2690s \
            python3 tests/Parchwell.Verifier.Tests/Mutation/c5_runtime.py local-shard \
            --shard "$SHARD" --output-dir "$DIAGNOSTIC_DIR/shard" --timeout 2650 \
            2>&1 | tee "$DIAGNOSTIC_DIR/launcher.log"
          printf 'completed_unverified\n' > "$DIAGNOSTIC_DIR/status.txt"
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c5-sizing-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            ${{ env.DIAGNOSTIC_DIR }}
            !${{ env.DIAGNOSTIC_DIR }}/**/rpc-*.log
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
      - name: Retain detailed test-server RPC logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c5-sizing-rpc-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ env.DIAGNOSTIC_DIR }}/**/rpc-*.log
          if-no-files-found: ignore
          retention-days: 1
          include-hidden-files: true
