name: Cleanup backup branches

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-wip-branches
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ github.repository == 'collaborationwithothers/eventhubs-kafka-dotnet' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out approved main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Clean redundant backup branches
        run: python3 scripts/cleanup-wip-branches.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
