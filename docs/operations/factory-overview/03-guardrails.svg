<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" role="img" aria-label="Guardrails in three groups: enforced by a machine, followed by convention, and decided only by Hari, with the known gaps listed below." font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A202C"/></marker></defs>
<rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>
<text x="24" y="30" font-size="19" font-weight="700" fill="#1A202C">Guardrails: what a machine enforces and what relies on agents following text</text>
<text x="24" y="50" font-size="13" fill="#4A5568">The left column is enforced by tools. The middle column depends on agents following written rules.</text>
<rect x="30" y="70" width="380" height="40" rx="8" fill="#E6F0FB" stroke="#2B6CB0" stroke-width="1.6"/>
<text x="220.0" y="95.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1A202C">Enforced by a machine</text>
<rect x="430" y="70" width="380" height="40" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="620.0" y="95.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1A202C">Followed by convention (written rules and prompts)</text>
<rect x="830" y="70" width="380" height="40" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6"/>
<text x="1020.0" y="95.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1A202C">Only Hari decides</text>
<rect x="30" y="124" width="380" height="62" rx="8" fill="#E6F0FB" stroke="#2B6CB0" stroke-width="1.6"/>
<text x="220.0" y="144.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Ruleset on main</text>
<text x="220.0" y="164.0" font-size="12.5" text-anchor="middle" fill="#1A202C">No direct pushes or force pushes;</text>
<text x="220.0" y="180.0" font-size="12.5" text-anchor="middle" fill="#1A202C">protected paths need Hari's approval</text>
<rect x="30" y="196" width="380" height="62" rx="8" fill="#E6F0FB" stroke="#2B6CB0" stroke-width="1.6"/>
<text x="220.0" y="216.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Azure access gates</text>
<text x="220.0" y="236.0" font-size="12.5" text-anchor="middle" fill="#1A202C">Scenario runs need Hari's approval;</text>
<text x="220.0" y="252.0" font-size="12.5" text-anchor="middle" fill="#1A202C">the sweeper environment is main-only</text>
<rect x="30" y="268" width="380" height="62" rx="8" fill="#E6F0FB" stroke="#2B6CB0" stroke-width="1.6"/>
<text x="220.0" y="288.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Workflow files</text>
<text x="220.0" y="308.0" font-size="12.5" text-anchor="middle" fill="#1A202C">Protected paths; runs from outside</text>
<text x="220.0" y="324.0" font-size="12.5" text-anchor="middle" fill="#1A202C">contributors need Hari's approval</text>
<rect x="30" y="340" width="380" height="62" rx="8" fill="#E6F0FB" stroke="#2B6CB0" stroke-width="1.6"/>
<text x="220.0" y="360.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">CI on pull requests</text>
<text x="220.0" y="380.0" font-size="12.5" text-anchor="middle" fill="#1A202C">.NET verification runs on every pull request;</text>
<text x="220.0" y="396.0" font-size="12.5" text-anchor="middle" fill="#1A202C">documentation checks are advisory</text>
<rect x="30" y="412" width="380" height="62" rx="8" fill="#E6F0FB" stroke="#2B6CB0" stroke-width="1.6"/>
<text x="220.0" y="432.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Stop hook (where enabled)</text>
<text x="220.0" y="452.0" font-size="12.5" text-anchor="middle" fill="#1A202C">Blocks ending without a handoff comment, up to</text>
<text x="220.0" y="468.0" font-size="12.5" text-anchor="middle" fill="#1A202C">three times; unverified in GitHub Actions</text>
<rect x="430" y="124" width="380" height="54" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="620.0" y="148.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">No terraform apply or destroy by agents</text>
<text x="620.0" y="168.0" font-size="12.5" text-anchor="middle" fill="#1A202C">a rule; no technical block identified</text>
<rect x="430" y="188" width="380" height="54" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="620.0" y="212.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">No Azure credentials in agent sessions</text>
<text x="620.0" y="232.0" font-size="12.5" text-anchor="middle" fill="#1A202C">a rule; no technical block identified</text>
<rect x="430" y="252" width="380" height="54" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="620.0" y="276.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Only Hari applies ready-for-agent</text>
<text x="620.0" y="296.0" font-size="12.5" text-anchor="middle" fill="#1A202C">its plan approval</text>
<rect x="430" y="316" width="380" height="54" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="620.0" y="340.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">No edits to expected outcomes,</text>
<text x="620.0" y="360.0" font-size="12.5" text-anchor="middle" fill="#1A202C">verdicts or results to make a run pass</text>
<rect x="430" y="380" width="380" height="54" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="620.0" y="404.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Decision and Approval headings</text>
<text x="620.0" y="424.0" font-size="12.5" text-anchor="middle" fill="#1A202C">every comment posts as Hari's account</text>
<rect x="430" y="444" width="380" height="54" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="620.0" y="468.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Codex review before agent merge</text>
<text x="620.0" y="488.0" font-size="12.5" text-anchor="middle" fill="#1A202C">no open P0/P1 or High security finding</text>
<rect x="430" y="508" width="380" height="54" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="620.0" y="532.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">GitHub text is data, not instructions</text>
<text x="620.0" y="552.0" font-size="12.5" text-anchor="middle" fill="#1A202C">a defence written into the session prompt</text>
<rect x="830" y="124" width="380" height="54" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6"/>
<text x="1020.0" y="148.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Item plan</text>
<text x="1020.0" y="168.0" font-size="12.5" text-anchor="middle" fill="#1A202C">applies ready-for-agent</text>
<rect x="830" y="188" width="380" height="54" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6"/>
<text x="1020.0" y="212.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Verdict pull requests</text>
<text x="1020.0" y="232.0" font-size="12.5" text-anchor="middle" fill="#1A202C">approves or rejects the evidence</text>
<rect x="830" y="252" width="380" height="54" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6"/>
<text x="1020.0" y="276.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Every scenario run</text>
<text x="1020.0" y="296.0" font-size="12.5" text-anchor="middle" fill="#1A202C">environment gate: Hari approves</text>
<rect x="830" y="316" width="380" height="54" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6"/>
<text x="1020.0" y="340.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Persistent infrastructure</text>
<text x="1020.0" y="360.0" font-size="12.5" text-anchor="middle" fill="#1A202C">only Hari applies the persistent layer</text>
<rect x="830" y="380" width="380" height="62" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6"/>
<text x="1020.0" y="400.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Protected paths (full list: CODEOWNERS)</text>
<text x="1020.0" y="420.0" font-size="12.5" text-anchor="middle" fill="#1A202C">for example workflows, governance, ADRs,</text>
<text x="1020.0" y="436.0" font-size="12.5" text-anchor="middle" fill="#1A202C">verifier, scripts, results, project files</text>
<rect x="30" y="640" width="1180" height="100" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.6"/>
<text x="620.0" y="671.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Known gaps today</text>
<text x="620.0" y="691.0" font-size="12.5" text-anchor="middle" fill="#1A202C">Agent merges are not audited: the weekly spot-check has not started, and GitHub shows one account as the author of every pull request.</text>
<text x="620.0" y="707.0" font-size="12.5" text-anchor="middle" fill="#1A202C">The Stop hook acts only where enabled and is unverified in Actions. A dead session writes no handoff; its backup branch, if any, remains.</text>
<text x="620.0" y="723.0" font-size="12.5" text-anchor="middle" fill="#1A202C">No technical block on terraform apply was identified; the rule is text.</text>
</svg>
