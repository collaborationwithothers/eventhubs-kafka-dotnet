<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 868" width="1240" height="868" role="img" aria-label="Target state: Hari applies a label, a GitHub Actions workflow starts the sessions, and a merge workflow applies deterministic rules and a risk classifier. Hari's target is that a low classifier score lets a pull request merge automatically; anything flagged waits for Hari. The documented design differs, as the note states." font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A202C"/></marker></defs>
<rect x="0" y="0" width="1240" height="868" fill="#FFFFFF"/>
<text x="24" y="30" font-size="19" font-weight="700" fill="#1A202C">Target state: sessions start themselves; a risk classifier lets low-risk pull requests merge automatically</text>
<text x="24" y="50" font-size="13" fill="#4A5568">Dashed boxes are not built yet. The teal box is Hari's target. Hari still approves plans, verdicts and every escalation.</text>
<rect x="40" y="80" width="200" height="70" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6"/>
