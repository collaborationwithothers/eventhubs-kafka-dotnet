<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" role="img" aria-label="Target state: Hari applies a label, a GitHub Actions workflow starts the sessions, and a merge workflow applies deterministic rules plus, if a trial succeeds, a risk classifier that can only add escalations; spot-checks and an escape count feed the decision to trial it." font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A202C"/></marker></defs>
<rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>
<text x="24" y="30" font-size="19" font-weight="700" fill="#1A202C">Target state: sessions start themselves; merges are routed by rules, with a classifier on trial</text>
<text x="24" y="50" font-size="13" fill="#4A5568">Dashed boxes are not built yet. Hari still approves plans, verdicts and every escalation. The classifier can only add escalations.</text>
<rect x="40" y="80" width="200" height="70" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6"/>
<text x="140.0" y="112.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Hari</text>
<text x="140.0" y="132.0" font-size="12.5" text-anchor="middle" fill="#1A202C">applies ready-for-agent</text>
<rect x="300" y="80" width="240" height="70" rx="8" fill="#E6F0FB" stroke="#2B6CB0" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="420.0" y="104.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Orchestration workflow</text>
<text x="420.0" y="124.0" font-size="12.5" text-anchor="middle" fill="#1A202C">GitHub Actions replaces the</text>
<text x="420.0" y="140.0" font-size="12.5" text-anchor="middle" fill="#1A202C">control session</text>
<rect x="600" y="80" width="300" height="70" rx="8" fill="#E6F0FB" stroke="#2B6CB0" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="750.0" y="104.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Sessions started by the workflow</text>
<text x="750.0" y="124.0" font-size="12.5" text-anchor="middle" fill="#1A202C">plan, check, implement, review;</text>
<text x="750.0" y="140.0" font-size="12.5" text-anchor="middle" fill="#1A202C">Codex implements in Actions too</text>
<rect x="960" y="80" width="200" height="70" rx="8" fill="#EEF1F5" stroke="#4A5568" stroke-width="1.6"/>
<text x="1060.0" y="112.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Pull request</text>
<text x="1060.0" y="132.0" font-size="12.5" text-anchor="middle" fill="#1A202C">opened after the cold review</text>
<path d="M240,115 L300,115" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<text x="270" y="74" font-size="11" text-anchor="middle" fill="#1A202C" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">label</text>
<path d="M540,115 L600,115" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<text x="570" y="74" font-size="11" text-anchor="middle" fill="#1A202C" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">starts</text>
<path d="M900,115 L960,115" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<text x="930" y="74" font-size="11" text-anchor="middle" fill="#1A202C" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">opens</text>
<path d="M1060,150 L1060,220" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="900" y="220" width="260" height="70" rx="8" fill="#E3F5EA" stroke="#2F855A" stroke-width="1.6"/>
<text x="1030.0" y="244.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Codex review</text>
<text x="1030.0" y="264.0" font-size="12.5" text-anchor="middle" fill="#1A202C">code review and</text>
<text x="1030.0" y="280.0" font-size="12.5" text-anchor="middle" fill="#1A202C">security review</text>
<path d="M900,255 L840,255" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="360" y="220" width="480" height="70" rx="8" fill="#EEF1F5" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="600.0" y="244.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Merge workflow</text>
<text x="600.0" y="264.0" font-size="12.5" text-anchor="middle" fill="#1A202C">reads the review status and the checks below,</text>
<text x="600.0" y="280.0" font-size="12.5" text-anchor="middle" fill="#1A202C">then decides: merge or escalate</text>
<path d="M600,290 L600,330" fill="none" stroke="#1A202C" stroke-width="1.6"/>
<path d="M230,330 L970,330" fill="none" stroke="#1A202C" stroke-width="1.6"/>
<path d="M230,330 L230,360" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="80" y="360" width="300" height="90" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6"/>
<text x="230.0" y="394.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Protected path touched?</text>
<text x="230.0" y="414.0" font-size="12.5" text-anchor="middle" fill="#1A202C">ruleset requires Hari</text>
<text x="230.0" y="430.0" font-size="12.5" text-anchor="middle" fill="#1A202C">(built)</text>
<path d="M600,330 L600,360" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="450" y="360" width="300" height="90" rx="8" fill="#EEF1F5" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="600.0" y="394.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Codex silent for 60 minutes?</text>
<text x="600.0" y="414.0" font-size="12.5" text-anchor="middle" fill="#1A202C">posts Review unavailable;</text>
<text x="600.0" y="430.0" font-size="12.5" text-anchor="middle" fill="#1A202C">waits for Hari</text>
<path d="M970,330 L970,360" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="820" y="360" width="300" height="90" rx="8" fill="#EEF1F5" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="970.0" y="394.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Risk classifier (on trial)</text>
<text x="970.0" y="414.0" font-size="12.5" text-anchor="middle" fill="#1A202C">Jev or another model; shadow mode</text>
<text x="970.0" y="430.0" font-size="12.5" text-anchor="middle" fill="#1A202C">first; can only add escalations</text>
<path d="M230,450 L230,480 L970,480" fill="none" stroke="#1A202C" stroke-width="1.6"/>
<path d="M600,450 L600,480" fill="none" stroke="#1A202C" stroke-width="1.6"/>
<path d="M970,450 L970,480" fill="none" stroke="#1A202C" stroke-width="1.6"/>
<path d="M300,480 L300,520" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M880,480 L880,520" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<text x="310" y="505" font-size="11.5" text-anchor="start" fill="#1A202C" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">nothing flagged</text>
<text x="890" y="505" font-size="11.5" text-anchor="start" fill="#1A202C" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">anything flagged</text>
<rect x="130" y="520" width="340" height="70" rx="8" fill="#E6F0FB" stroke="#2B6CB0" stroke-width="1.6"/>
<text x="300.0" y="544.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Agent merges its own PR</text>
<text x="300.0" y="564.0" font-size="12.5" text-anchor="middle" fill="#1A202C">built today for unprotected paths</text>
<text x="300.0" y="580.0" font-size="12.5" text-anchor="middle" fill="#1A202C">under the merge rule</text>
<rect x="710" y="520" width="340" height="70" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6"/>
<text x="880.0" y="552.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Waits for Hari</text>
<text x="880.0" y="572.0" font-size="12.5" text-anchor="middle" fill="#1A202C">escalation, never silent</text>
<rect x="40" y="630" width="230" height="100" rx="8" fill="#EEF1F5" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="155.0" y="653.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Same-vendor label</text>
<text x="155.0" y="673.0" font-size="12.5" text-anchor="middle" fill="#1A202C">labels PRs with a Codex or no</text>
<text x="155.0" y="689.0" font-size="12.5" text-anchor="middle" fill="#1A202C">tool trailer; merge commits and</text>
<text x="155.0" y="705.0" font-size="12.5" text-anchor="middle" fill="#1A202C">Hari's own untrailed commits</text>
<text x="155.0" y="721.0" font-size="12.5" text-anchor="middle" fill="#1A202C">are ignored</text>
<rect x="300" y="630" width="240" height="100" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="420.0" y="669.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Weekly spot-check</text>
<text x="420.0" y="689.0" font-size="12.5" text-anchor="middle" fill="#1A202C">Hari samples about 5 agent</text>
<text x="420.0" y="705.0" font-size="12.5" text-anchor="middle" fill="#1A202C">merges a week</text>
<rect x="570" y="630" width="240" height="100" rx="8" fill="#EEF1F5" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="690.0" y="669.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Escape-count script</text>
<text x="690.0" y="689.0" font-size="12.5" text-anchor="middle" fill="#1A202C">counts serious defects the</text>
<text x="690.0" y="705.0" font-size="12.5" text-anchor="middle" fill="#1A202C">cold review should have caught</text>
<rect x="840" y="630" width="330" height="100" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="1005.0" y="653.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Decision to trial the classifier</text>
<text x="1005.0" y="673.0" font-size="12.5" text-anchor="middle" fill="#1A202C">about 50 PRs labelled by spot-checks;</text>
<text x="1005.0" y="689.0" font-size="12.5" text-anchor="middle" fill="#1A202C">a measured problem with the gate;</text>
<text x="1005.0" y="705.0" font-size="12.5" text-anchor="middle" fill="#1A202C">general availability, or committed access</text>
<text x="1005.0" y="721.0" font-size="12.5" text-anchor="middle" fill="#1A202C">with published pricing and data handling</text>
