<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" role="img" aria-label="Target state: Hari applies a label, a GitHub Actions workflow starts the sessions, a merge workflow combines deterministic rules and a risk classifier to merge low-risk pull requests, and spot-checks feed the decision to trial the classifier." font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A202C"/></marker></defs>
<rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>
<text x="24" y="30" font-size="19" font-weight="700" fill="#1A202C">Target state: sessions start themselves and low-risk pull requests merge themselves</text>
<text x="24" y="50" font-size="13" fill="#4A5568">Dashed boxes are not built yet. Hari still approves plans, verdicts and every escalation.</text>
<rect x="40" y="80" width="200" height="70" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6"/>
<text x="140.0" y="112.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Hari</text>
<text x="140.0" y="132.0" font-size="12.5" text-anchor="middle" fill="#1A202C">applies ready-for-agent</text>
<rect x="300" y="80" width="240" height="70" rx="8" fill="#E6F0FB" stroke="#2B6CB0" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="420.0" y="104.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Orchestration workflow</text>
<text x="420.0" y="124.0" font-size="12.5" text-anchor="middle" fill="#1A202C">GitHub Actions replaces the</text>
<text x="420.0" y="140.0" font-size="12.5" text-anchor="middle" fill="#1A202C">control session</text>
<rect x="600" y="80" width="300" height="70" rx="8" fill="#E6F0FB" stroke="#2B6CB0" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="750.0" y="104.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Sessions started by the workflow</text>
<text x="750.0" y="124.0" font-size="12.5" text-anchor="middle" fill="#1A202C">plan, check, implement, review;</text>
<text x="750.0" y="140.0" font-size="12.5" text-anchor="middle" fill="#1A202C">Codex implements in Actions too</text>
<rect x="960" y="80" width="200" height="70" rx="8" fill="#EEF1F5" stroke="#4A5568" stroke-width="1.6"/>
<text x="1060.0" y="112.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Pull request</text>
<text x="1060.0" y="132.0" font-size="12.5" text-anchor="middle" fill="#1A202C">opened by the session</text>
<path d="M240,115 L300,115" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<text x="270" y="74" font-size="11" text-anchor="middle" fill="#1A202C" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">label</text>
<path d="M540,115 L600,115" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<text x="570" y="74" font-size="11" text-anchor="middle" fill="#1A202C" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">starts</text>
<path d="M900,115 L960,115" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<text x="930" y="74" font-size="11" text-anchor="middle" fill="#1A202C" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">opens</text>
<path d="M1060,150 L1060,220" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="900" y="220" width="260" height="70" rx="8" fill="#E3F5EA" stroke="#2F855A" stroke-width="1.6"/>
<text x="1030.0" y="244.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Reviews</text>
<text x="1030.0" y="264.0" font-size="12.5" text-anchor="middle" fill="#1A202C">cold review, Codex review</text>
<text x="1030.0" y="280.0" font-size="12.5" text-anchor="middle" fill="#1A202C">(security review too)</text>
<path d="M900,255 L840,255" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="360" y="220" width="480" height="70" rx="8" fill="#EEF1F5" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="600.0" y="244.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Merge workflow</text>
<text x="600.0" y="264.0" font-size="12.5" text-anchor="middle" fill="#1A202C">reads the trailers, labels and review status,</text>
<text x="600.0" y="280.0" font-size="12.5" text-anchor="middle" fill="#1A202C">then decides: merge or escalate</text>
<path d="M600,290 L600,330" fill="none" stroke="#1A202C" stroke-width="1.6"/>
<path d="M170,330 L1010,330" fill="none" stroke="#1A202C" stroke-width="1.6"/>
<path d="M170,330 L170,360" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="360" width="260" height="90" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6"/>
<text x="170.0" y="394.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Protected path touched?</text>
<text x="170.0" y="414.0" font-size="12.5" text-anchor="middle" fill="#1A202C">ruleset requires Hari</text>
<text x="170.0" y="430.0" font-size="12.5" text-anchor="middle" fill="#1A202C">(built)</text>
<path d="M450,330 L450,360" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="320" y="360" width="260" height="90" rx="8" fill="#EEF1F5" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="450.0" y="394.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Same vendor wrote and reviewed?</text>
<text x="450.0" y="414.0" font-size="12.5" text-anchor="middle" fill="#1A202C">label same-vendor-review</text>
<text x="450.0" y="430.0" font-size="12.5" text-anchor="middle" fill="#1A202C">adds an escalation</text>
<path d="M730,330 L730,360" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="600" y="360" width="260" height="90" rx="8" fill="#EEF1F5" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="730.0" y="394.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Codex silent for 60 minutes?</text>
<text x="730.0" y="414.0" font-size="12.5" text-anchor="middle" fill="#1A202C">posts Review unavailable;</text>
<text x="730.0" y="430.0" font-size="12.5" text-anchor="middle" fill="#1A202C">waits for Hari</text>
<path d="M1010,330 L1010,360" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="880" y="360" width="260" height="90" rx="8" fill="#EEF1F5" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="1010.0" y="394.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Risk classifier (Jev or other)</text>
<text x="1010.0" y="414.0" font-size="12.5" text-anchor="middle" fill="#1A202C">shadow mode first; can only</text>
<text x="1010.0" y="430.0" font-size="12.5" text-anchor="middle" fill="#1A202C">add escalations</text>
<path d="M170,450 L170,480 L1010,480" fill="none" stroke="#1A202C" stroke-width="1.6"/>
<path d="M450,450 L450,480" fill="none" stroke="#1A202C" stroke-width="1.6"/>
<path d="M730,450 L730,480" fill="none" stroke="#1A202C" stroke-width="1.6"/>
<path d="M1010,450 L1010,480" fill="none" stroke="#1A202C" stroke-width="1.6"/>
<path d="M300,480 L300,520" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M880,480 L880,520" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<text x="310" y="505" font-size="11.5" text-anchor="start" fill="#1A202C" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">nothing flagged</text>
<text x="890" y="505" font-size="11.5" text-anchor="start" fill="#1A202C" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">anything flagged</text>
<rect x="130" y="520" width="340" height="70" rx="8" fill="#E6F0FB" stroke="#2B6CB0" stroke-width="1.6"/>
<text x="300.0" y="544.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Agent merges its own PR</text>
<text x="300.0" y="564.0" font-size="12.5" text-anchor="middle" fill="#1A202C">built today for unprotected paths;</text>
<text x="300.0" y="580.0" font-size="12.5" text-anchor="middle" fill="#1A202C">the classifier would widen this</text>
<rect x="710" y="520" width="340" height="70" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6"/>
<text x="880.0" y="552.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Waits for Hari</text>
<text x="880.0" y="572.0" font-size="12.5" text-anchor="middle" fill="#1A202C">escalation, never silent</text>
<rect x="40" y="650" width="330" height="70" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="205.0" y="682.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Weekly spot-check</text>
<text x="205.0" y="702.0" font-size="12.5" text-anchor="middle" fill="#1A202C">Hari samples about 5 agent merges</text>
<rect x="440" y="650" width="330" height="70" rx="8" fill="#EEF1F5" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="605.0" y="674.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Escape-count script</text>
<text x="605.0" y="694.0" font-size="12.5" text-anchor="middle" fill="#1A202C">counts serious defects the</text>
<text x="605.0" y="710.0" font-size="12.5" text-anchor="middle" fill="#1A202C">cold review should have caught</text>
<rect x="840" y="650" width="330" height="70" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="1005.0" y="674.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Decision to trial the classifier</text>
<text x="1005.0" y="694.0" font-size="12.5" text-anchor="middle" fill="#1A202C">needs about 50 labelled PRs and</text>
<text x="1005.0" y="710.0" font-size="12.5" text-anchor="middle" fill="#1A202C">a measured problem with the gate</text>
<path d="M370,685 L440,685" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M770,685 L840,685" fill="none" stroke="#1A202C" stroke-width="1.6" marker-end="url(#a)"/>
