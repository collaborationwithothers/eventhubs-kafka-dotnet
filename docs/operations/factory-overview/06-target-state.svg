<text x="46" y="761" font-size="12" fill="#1A202C">Hari</text>
<rect x="98.4" y="750" width="16" height="12" rx="3" fill="#E6F0FB" stroke="#2B6CB0" stroke-width="1.5"/>
<text x="120.4" y="761" font-size="12" fill="#1A202C">Claude Code</text>
<rect x="219.0" y="750" width="16" height="12" rx="3" fill="#E3F5EA" stroke="#2F855A" stroke-width="1.5"/>
<text x="241.0" y="761" font-size="12" fill="#1A202C">Codex</text>
<rect x="300.0" y="750" width="16" height="12" rx="3" fill="#EEF1F5" stroke="#4A5568" stroke-width="1.5"/>
<text x="322.0" y="761" font-size="12" fill="#1A202C">GitHub</text>
<rect x="387.6" y="750" width="16" height="12" rx="3" fill="#FFFFFF" stroke="#718096" stroke-width="1.5" stroke-dasharray="4 3"/>
