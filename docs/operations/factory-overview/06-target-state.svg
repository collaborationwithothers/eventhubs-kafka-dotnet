<text x="140.0" y="132.0" font-size="12.5" text-anchor="middle" fill="#1A202C">applies ready-for-agent</text>
<rect x="300" y="80" width="240" height="70" rx="8" fill="#E6F0FB" stroke="#2B6CB0" stroke-width="1.6" stroke-dasharray="6 4"/>
