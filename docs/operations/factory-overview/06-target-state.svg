<text x="880.0" y="582.0" font-size="12.5" text-anchor="middle" fill="#1A202C">any escalation; never silent</text>
<rect x="40" y="620" width="1000" height="80" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.6" stroke-dasharray="6 4"/>
