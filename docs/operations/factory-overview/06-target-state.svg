<text x="540.0" y="661.0" font-size="12.5" text-anchor="middle" fill="#1A202C">docs/agents/factory.md today: an adopted classifier only adds escalations.</text>
<text x="540.0" y="677.0" font-size="12.5" text-anchor="middle" fill="#1A202C">AGENTS.md Merge rule: an agent merges only when its conditions hold; anything else waits for Hari.</text>
<text x="540.0" y="693.0" font-size="12.5" text-anchor="middle" fill="#1A202C">Hari's target (6 November 2026): a low score lets a pull request merge automatically. See the open questions in issue 394.</text>
