<text x="155.0" y="777.0" font-size="12.5" text-anchor="middle" fill="#1A202C">tool trailer; merge commits and</text>
<text x="155.0" y="793.0" font-size="12.5" text-anchor="middle" fill="#1A202C">Hari's own untrailed commits</text>
<text x="155.0" y="809.0" font-size="12.5" text-anchor="middle" fill="#1A202C">are ignored</text>
<rect x="300" y="718" width="240" height="100" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="420.0" y="757.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Weekly spot-check</text>
<text x="420.0" y="777.0" font-size="12.5" text-anchor="middle" fill="#1A202C">Hari samples about 5 agent</text>
<text x="420.0" y="793.0" font-size="12.5" text-anchor="middle" fill="#1A202C">merges a week</text>
<rect x="570" y="718" width="240" height="100" rx="8" fill="#EEF1F5" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="690.0" y="757.0" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A202C">Escape-count script</text>
<text x="690.0" y="777.0" font-size="12.5" text-anchor="middle" fill="#1A202C">counts serious defects the</text>
<text x="690.0" y="793.0" font-size="12.5" text-anchor="middle" fill="#1A202C">cold review should have caught</text>
<rect x="840" y="718" width="330" height="100" rx="8" fill="#FFF4DB" stroke="#B7791F" stroke-width="1.6" stroke-dasharray="6 4"/>
