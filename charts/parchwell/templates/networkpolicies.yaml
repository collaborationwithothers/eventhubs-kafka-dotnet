apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-default-deny" .Values.runtime.run_id | quote }}
  namespace: parchwell
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: parchwell
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-egress" .Values.runtime.run_id | quote }}
  namespace: parchwell
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: parchwell
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: {{ printf "%s/32" .Values.runtime.eventhubs_ip | quote }}
      ports:
        - protocol: TCP
          port: 9093
    - to:
        - ipBlock:
            cidr: {{ printf "%s/32" .Values.runtime.blob_ip | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- $tags := .Values.runtime.service_tags.tags }}
    {{- range (concat $tags.AzureActiveDirectory.address_prefixes $tags.AzureMonitor.address_prefixes | uniq | sortAlpha) }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
