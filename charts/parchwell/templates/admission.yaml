{{- if eq .Values.runtime.mode "loadgen" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.runtime.admission_name | quote }}
  namespace: parchwell
  labels:
    {{- include "parchwell.labels" . | nindent 4 }}
data: {}
binaryData:
  generated-values.yaml: {{ .Values.runtime.loadgen_generated_values | b64enc | quote }}
  verifier-values.yaml: {{ .Values.runtime.verifier_generated_values | b64enc | quote }}
{{- end }}
