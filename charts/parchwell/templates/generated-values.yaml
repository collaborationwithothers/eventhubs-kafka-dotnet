{{- range $role := list "loadgen" "verifier" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s-values" $.Values.runtime.run_id $role | quote }}
  namespace: parchwell
  labels:
    {{- include "parchwell.labels" $ | nindent 4 }}
binaryData:
  generated-values.yaml: {{ index $.Values.runtime (printf "%s_generated_values" $role) | b64enc | quote }}
{{- end }}
