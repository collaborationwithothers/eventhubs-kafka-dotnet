{{- range $role := list "loadgen" "verifier" }}
{{- $account := index $.Values.runtime.service_accounts $role }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account.name | quote }}
  namespace: parchwell
  annotations:
    azure.workload.identity/client-id: {{ $account.client_id | quote }}
  labels:
    {{- include "parchwell.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
