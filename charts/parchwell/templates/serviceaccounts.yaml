{{- $roles := list "loadgen" "verifier" -}}
{{- if has .Values.runtime.mode (list "single-action" "single-action-judge" "single-action-seed" "single-action-v2" "single-action-v2-judge") }}{{ $roles = list "loadgen" "verifier" "probe" "enrichment-consumer" }}{{ end -}}
{{- range $role := $roles }}
{{- $account := index $.Values.runtime.service_accounts $role }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account.name | quote }}
  namespace: parchwell
  annotations:
    azure.workload.identity/client-id: {{ $account.client_id | quote }}
  labels:
    {{- include "parchwell.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
